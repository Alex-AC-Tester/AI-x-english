<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#fbfaf6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="AI 驱动的拍照背单词与每日测评工具" />
  <title>词智 WordWise · AI 背单词</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>词</span></div>
        <div class="brand-text"><strong>词智</strong><small>WordWise · 词汇精读</small></div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-user" id="sideUser"></div>
      <div class="sidebar-foot">
        <div class="sync-pill" id="syncPill"><i></i><span>本地就绪</span></div>
        <div class="side-note">拍照导入 · AI 出题 · 即时反馈</div>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="菜单"></button>
          <div class="page-title">
            <h1 id="pageTitle">今日</h1>
            <p id="pageSubtitle">开始今天的学习循环</p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="streak-chip" id="streakChip" title="连续学习天数"></div>
          <button class="icon-btn" id="bellBtn" type="button" aria-label="提醒设置"></button>
        </div>
      </header>

      <main class="view" id="view"></main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <input type="file" id="globalFileInput" hidden />

  <script type="module" src="./js/app.js"></script>
</body>
</html>
